services:
  al1s-wms:
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    image: al1s-wms:local
    container_name: al1s-wms
    restart: unless-stopped
    ports:
      - "${AL1S_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      UPLOADS_DIR: /data/uploads
    volumes:
      - al1s-wms-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  al1s-wms-data:
